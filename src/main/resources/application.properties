logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.root=DEBUG

server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.servlet.session.timeout=450s

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smdb}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:smdbtsu}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

management.port=18081
#management.security.enabled=false
#management.security.role=ADMIN


#Enable shutdown endpoint
endpoints.shutdown.enabled=true

flyway.user=${DB_USER:smdbtsu}
flyway.password=${DB_PASSWORD}

server.port=8081

# List are defined as comma-separated values
flyway.schemas=smdb
flyway.url=${DB_URL:jdbc:mysql://localhost:3306/smdb}

application.name=Tech Debt Score
application.audit.enabled=false
log.dir=/var/log/smartbrains/techdebtscore
